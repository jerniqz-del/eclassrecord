<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src data:">
  <title>Sudoku</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #f8fafc; color: #17202a; font-family: Arial, sans-serif; }
    main { width: min(560px, 100%); margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: 0; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    select, button { min-height: 36px; padding: 7px 12px; border: 1px solid #cbd5e1; border-radius: 4px; background: #fff; color: #17202a; font: inherit; }
    button { cursor: pointer; font-weight: 700; }
    button.primary { border-color: #0f766e; background: #0f766e; color: #fff; }
    .board { display: grid; grid-template-columns: repeat(9, 1fr); width: min(504px, 100%); aspect-ratio: 1; border: 3px solid #17202a; background: #17202a; gap: 1px; }
    .cell { min-width: 0; width: 100%; border: 0; border-radius: 0; padding: 0; background: #fff; color: #0f4c5c; font-size: clamp(15px, 4vw, 25px); font-weight: 700; text-align: center; outline: none; }
    .cell.given { background: #e2e8f0; color: #17202a; }
    .cell.error { background: #fee2e2; color: #b91c1c; }
    .cell:focus { box-shadow: inset 0 0 0 3px #f59e0b; }
    .cell:nth-child(3n) { border-right: 2px solid #17202a; }
    .cell:nth-child(9n) { border-right: 0; }
    .cell:nth-child(n+19):nth-child(-n+27), .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #17202a; }
    .status { min-height: 24px; margin: 14px 0; color: #475569; font-weight: 700; }
    @media (max-width: 520px) { body { padding: 12px; } .board { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Sudoku</h1><span id="difficultyLabel">Medium</span></header>
    <div class="controls">
      <select id="difficulty" aria-label="Difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
        <option value="expert">Expert</option>
      </select>
      <button class="primary" id="newPuzzle" type="button">New Puzzle</button>
      <button id="checkPuzzle" type="button">Check</button>
      <button id="clearPuzzle" type="button">Clear Entries</button>
    </div>
    <div id="board" class="board" aria-label="Sudoku board"></div>
    <div id="status" class="status" aria-live="polite">Preparing puzzle...</div>
  </main>
  <script>
    (() => {
      const board = document.getElementById('board');
      const status = document.getElementById('status');
      const difficulty = document.getElementById('difficulty');
      const difficultyLabel = document.getElementById('difficultyLabel');
      let current = null;

      function requestPuzzle() {
        status.textContent = 'Preparing puzzle...';
        parent.postMessage({ type: 'teacher-tools:sudoku-request', difficulty: difficulty.value }, '*');
      }

      function renderPuzzle(payload) {
        current = payload;
        board.innerHTML = '';
        difficultyLabel.textContent = payload.difficulty.charAt(0).toUpperCase() + payload.difficulty.slice(1);
        Array.from(payload.puzzle).forEach((token, index) => {
          const input = document.createElement('input');
          input.className = token === '-' ? 'cell' : 'cell given';
          input.value = token === '-' ? '' : token;
          input.disabled = token !== '-';
          input.inputMode = 'numeric';
          input.maxLength = 1;
          input.setAttribute('aria-label', `Row ${Math.floor(index / 9) + 1}, column ${(index % 9) + 1}`);
          input.addEventListener('input', () => {
            input.value = input.value.replace(/[^1-9]/g, '').slice(0, 1);
            input.classList.remove('error');
          });
          board.appendChild(input);
        });
        status.textContent = 'Puzzle ready.';
      }

      function checkPuzzle() {
        if (!current) return;
        let complete = true;
        let errors = 0;
        Array.from(board.children).forEach((input, index) => {
          if (!input.value) complete = false;
          const wrong = input.value && input.value !== current.solution[index];
          input.classList.toggle('error', Boolean(wrong));
          if (wrong) errors++;
        });
        status.textContent = errors
          ? `${errors} incorrect ${errors === 1 ? 'entry' : 'entries'}.`
          : complete ? 'Puzzle completed correctly.' : 'No incorrect entries so far.';
      }

      document.getElementById('newPuzzle').addEventListener('click', requestPuzzle);
      document.getElementById('checkPuzzle').addEventListener('click', checkPuzzle);
      document.getElementById('clearPuzzle').addEventListener('click', () => {
        Array.from(board.children).forEach(input => {
          if (!input.disabled) input.value = '';
          input.classList.remove('error');
        });
        status.textContent = 'Entries cleared.';
      });
      difficulty.addEventListener('change', requestPuzzle);
      window.addEventListener('message', event => {
        if (event.source !== parent) return;
        if (event.data?.type === 'teacher-tools:sudoku-puzzle') renderPuzzle(event.data.puzzle);
        if (event.data?.type === 'teacher-tools:sudoku-error') status.textContent = 'A new puzzle could not be prepared.';
      });
      requestPuzzle();
    })();
  </script>
</body>
</html>
