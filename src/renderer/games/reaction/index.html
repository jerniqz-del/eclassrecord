<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Reaction Challenge</title><style>body{margin:0;font:16px system-ui;background:#0f172a;color:#fff;display:grid;place-items:center;min-height:100vh}.app{text-align:center;width:min(700px,90vw)}#arena{display:grid;place-items:center;height:340px;border-radius:24px;background:#334155;cursor:pointer;user-select:none;transition:.2s}#arena.ready{background:#16a34a;transform:scale(1.02)}button{padding:12px 24px;border:0;border-radius:12px;background:#06b6d4;color:#fff;font-weight:800;cursor:pointer}.score{font-size:1.2rem}</style></head><body><main class="app"><h1>Reaction Challenge</h1><p>Wait for green, then click as quickly as possible.</p><div id="arena">Press Start</div><p class="score" id="score">Best: —</p><button id="start">Start Round</button></main><script>let timer,startTime,best=Infinity,waiting=false;const arena=document.getElementById('arena'),score=document.getElementById('score');document.getElementById('start').onclick=()=>{clearTimeout(timer);waiting=true;arena.className='';arena.textContent='Wait for green…';timer=setTimeout(()=>{waiting=false;startTime=performance.now();arena.className='ready';arena.textContent='CLICK!'},1200+Math.random()*2600)};arena.onclick=()=>{if(waiting){clearTimeout(timer);waiting=false;arena.textContent='Too early! Start again.';return}if(!startTime)return;const result=Math.round(performance.now()-startTime);startTime=0;best=Math.min(best,result);arena.className='';arena.textContent=result+' ms';score.textContent='Best: '+best+' ms'}</script></body></html>
