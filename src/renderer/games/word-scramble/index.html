<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Word Scramble</title><style>body{margin:0;font:16px system-ui;background:#ecfeff;color:#164e63;min-height:100vh;display:grid;place-items:center}.app{width:min(620px,90vw);padding:35px;border-radius:24px;background:#fff;text-align:center;box-shadow:0 22px 60px #0e749033}.word{margin:24px;font-size:clamp(2rem,8vw,4rem);font-weight:900;letter-spacing:.18em;color:#0891b2}input,button{padding:12px 16px;border-radius:10px;font:inherit}input{border:2px solid #67e8f9}button{border:0;background:#0891b2;color:#fff;font-weight:800;cursor:pointer}.score{font-weight:800}</style></head><body><main class="app"><h1>Word Scramble</h1><p>Unscramble the classroom word.</p><div id="word" class="word"></div><input id="answer" autocomplete="off" placeholder="Your answer"><button id="check">Check</button><p id="message"></p><p id="score" class="score">Score: 0</p></main><script>const words=['LEARNER','TEACHER','SCIENCE','READING','NUMBER','SCHOOL','LESSON','PROJECT','HISTORY','CREATIVE'];let current,points=0;function next(){current=words[Math.floor(Math.random()*words.length)];let mixed;do mixed=[...current].sort(()=>Math.random()-.5).join('');while(mixed===current);word.textContent=mixed;answer.value='';answer.focus()}check.onclick=()=>{if(answer.value.trim().toUpperCase()===current){points++;message.textContent='Correct! 🎉';score.textContent='Score: '+points;setTimeout(next,650)}else message.textContent='Try again!'};answer.onkeydown=e=>{if(e.key==='Enter')check.click()};next()</script></body></html>
