<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Memory Match</title><style>body{margin:0;font:16px system-ui;background:linear-gradient(135deg,#312e81,#0f172a);color:#fff;min-height:100vh;display:grid;place-items:center}.app{width:min(650px,92vw);text-align:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{aspect-ratio:1;border:0;border-radius:18px;background:#6366f1;color:transparent;font-size:2.4rem;cursor:pointer;box-shadow:0 8px 0 #1e1b4b;transition:.2s}.card.open,.card.done{background:#fff;color:#312e81;transform:translateY(6px);box-shadow:0 2px 0 #c7d2fe}.card.done{background:#a7f3d0}button.reset{margin-top:18px;padding:10px 20px;border:0;border-radius:10px;font-weight:800}</style></head><body><main class="app"><h1>Memory Match</h1><p id="status">Find all eight pairs.</p><div id="grid" class="grid"></div><button class="reset" onclick="reset()">New Board</button></main><script>const icons=['⭐','🚀','🎨','📚','🏆','🌈','🧩','🎯'];let open=[],moves=0,locked=false;function reset(){open=[];moves=0;locked=false;const values=[...icons,...icons].sort(()=>Math.random()-.5);grid.innerHTML=values.map((v,i)=>'<button class="card" data-value="'+v+'" data-i="'+i+'">'+v+'</button>').join('');status.textContent='Find all eight pairs.'}grid.onclick=e=>{const card=e.target.closest('.card');if(!card||locked||card.classList.contains('open')||card.classList.contains('done'))return;card.classList.add('open');open.push(card);if(open.length<2)return;moves++;if(open[0].dataset.value===open[1].dataset.value){open.forEach(c=>c.className='card done');open=[];status.textContent='Moves: '+moves;if(document.querySelectorAll('.done').length===16)status.textContent='Completed in '+moves+' moves!'}else{locked=true;setTimeout(()=>{open.forEach(c=>c.classList.remove('open'));open=[];locked=false},650)}};reset()</script></body></html>
